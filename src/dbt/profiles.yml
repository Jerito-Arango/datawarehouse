ecommerce_dw:
  target: redshift
  outputs:
    redshift:
      type: redshift
      host: "{{ env_var('REDSHIFT_HOST') }}"
      port: 5439
      user: "{{ env_var('REDSHIFT_USER', 'dwadmin') }}"
      password: "{{ env_var('REDSHIFT_PASSWORD') }}"
      dbname: "{{ env_var('REDSHIFT_DB', 'dw') }}"
      schema: intermediate
      sslmode: require
      threads: 4
      connect_timeout: 30
